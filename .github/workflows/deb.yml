name: deb

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the tags, for the version
      - name: Build
        run: echo "DEB=$(deploy/build-deb.sh "$(deploy/version.sh)")" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" "$DEB" --clobber
